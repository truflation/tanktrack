[project]
name = "tanktrack"
version = "0.1.0"
description = "Real-time vessel geofence monitor with AIS + anchor detection (Strait of Hormuz baseline)"
requires-python = ">=3.12"
dependencies = [
  "websockets>=13.0",
  "httpx>=0.27",
  "shapely>=2.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[project.scripts]
tanktrack = "tanktrack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tanktrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
